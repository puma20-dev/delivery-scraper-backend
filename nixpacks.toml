[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa"]
 
[phases.install]
cmds = [
  "python3.11 -m pip install -r requirements.txt",
  "python3.11 -m playwright install chromium"
]
 
[start]
cmd = "python3.11 -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
 
